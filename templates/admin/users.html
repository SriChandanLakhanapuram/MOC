{% extends "base.html" %}{% block title %}Accounts{% endblock %}{% block content %}<h1 class="text-2xl font-bold mb-5">Accounts</h1><form method="post" action="{{ url_for('admin.add_user') }}" class="bg-white border rounded-xl p-5 mb-6 grid sm:grid-cols-2 lg:grid-cols-5 gap-3"><input name="name" required placeholder="Full name" class="border rounded p-2"><input name="email" type="email" required placeholder="Email" class="border rounded p-2"><input name="password" type="password" required minlength="10" placeholder="Temporary password" class="border rounded p-2"><select name="role" class="border rounded p-2">{% for role in ['Student','Admin','Faculty','ExamCell','HOD'] %}<option>{{ role }}</option>{% endfor %}</select><button class="bg-indigo-700 text-white rounded px-4">Create account</button></form><div class="bg-white border rounded-xl overflow-auto"><table class="w-full text-sm"><thead class="bg-gray-50"><tr><th class="p-3 text-left">Name</th><th class="p-3 text-left">Email</th><th class="p-3 text-left">Role</th></tr></thead><tbody>{% for u in users %}<tr class="border-t"><td class="p-3">{{ u.name }}</td><td class="p-3">{{ u.email }}</td><td class="p-3">{{ u.role }}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
