{% extends "base.html" %}{% block title %}Workflow Reports{% endblock %}{% block content %}<h1 class="text-2xl font-bold mb-5">Examination workflow report</h1><div class="grid sm:grid-cols-3 gap-3">{% for state,count in state_counts.items() %}<div class="bg-white border rounded-xl p-4"><div class="text-2xl font-bold text-indigo-700">{{ count }}</div><div>{{ state }}</div></div>{% endfor %}</div><div class="bg-white border rounded-xl p-5 mt-5"><canvas id="statusChart" aria-label="Student counts by workflow state"></canvas></div>{% endblock %}{% block extra_scripts %}<script>const report={{ chart_data|safe }};new Chart(document.getElementById('statusChart'),{type:'bar',data:{labels:report.states.labels,datasets:[{label:'Students',data:report.states.data,backgroundColor:'#4f46e5'}]},options:{responsive:true,scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});</script>{% endblock %}
